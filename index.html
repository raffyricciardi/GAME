<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronicles AI — Text Adventure RPG</title>
  <style>
    :root {
      --bg-dark: #0f1016;
      --card-bg: rgba(26, 28, 41, 0.75);
      --border-glow: #6366f1;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-gold: #fbbf24;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-dark) 70%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { font-size: 1.8rem; }
    .brand-title { font-family: Georgia, serif; font-size: 1.5rem; letter-spacing: 1px; color: #fff; }

    .hud-stats {
      display: flex;
      gap: 20px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-item { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.95rem; }
    .stat-hp { color: var(--accent-red); }
    .stat-gold { color: var(--accent-gold); }

    main {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 2rem;
    }

    .sidebar-card, .game-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 1rem;
      font-weight: 700;
    }

    .world-selector { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
    .world-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      border-radius: 10px;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .world-btn:hover, .world-btn.active {
      border-color: var(--border-glow);
      background: rgba(99, 102, 241, 0.15);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
    }

    .inventory-list { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
    .inventory-tag {
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .story-box {
      min-height: 220px;
      font-size: 1.15rem;
      line-height: 1.8;
      color: #e5e7eb;
      margin-bottom: 2rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 1.5rem;
      border-radius: 12px;
      border-left: 3px solid var(--border-glow);
    }

    .choices-grid { display: flex; flex-direction: column; gap: 12px; }
    .choice-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 1rem 1.5rem;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.25s;
    }
    .choice-btn:hover {
      background: var(--border-glow);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-start {
      width: 100%;
      background: var(--accent-green);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 25px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-icon">⚔️</span>
      <div class="brand-title">Chronicles AI</div>
    </div>
    
    <div class="hud-stats">
      <div class="stat-item stat-hp">❤️ HP: <span id="hp-val">100</span></div>
      <div class="stat-item stat-gold">🪙 Monete: <span id="gold-val">50</span></div>
    </div>
  </header>

  <main>
    <div class="sidebar-card">
      <div class="section-title">Ambientazione</div>
      <div class="world-selector">
        <button class="world-btn active" onclick="setWorld('Cyberpunk 2099', this)">🏙️ Cyberpunk 2099</button>
        <button class="world-btn" onclick="setWorld('Fantasy Medievale', this)">🐉 Fantasy Medievale</button>
        <button class="world-btn" onclick="setWorld('Mistero nello Spazio', this)">🚀 Sci-Fi Spaziale</button>
        <button class="world-btn" onclick="setWorld('Horror Post-Apocalittico', this)">🧟 Post-Apocalittico</button>
      </div>

      <div class="section-title" style="margin-top: 2rem;">Inventario</div>
      <ul class="inventory-list" id="inventory">
        <li class="inventory-tag">🗡️ Daga Rustica</li>
        <li class="inventory-tag">🧪 Pozione Piccola</li>
      </ul>

      <button class="btn-start" onclick="startAdventure()">🚀 Inizia Nuova Storia</button>
    </div>

    <div class="game-card">
      <div class="section-title">Capitolo Corrente</div>
      
      <div class="story-box" id="story-text">
        Seleziona un'ambientazione a sinistra e clicca su <b>"Inizia Nuova Storia"</b> per avviare la tua avventura generata dall'Intelligenza Artificiale!
      </div>

      <div class="section-title">Cosa vuoi fare?</div>
      <div class="choices-grid" id="choices-container">
        <button class="choice-btn" disabled>Inizia prima la partita per visualizzare le opzioni...</button>
      </div>
    </div>
  </main>

  <script>
    const API_KEY = "AQ.Ab8RN6JxLO_29nwZ3MnLyBcUtTvivDjijwC702fYLdpA_Ues0g"; 
    let currentWorld = "Cyberpunk 2099";

    function setWorld(worldName, el) {
      currentWorld = worldName;
      document.querySelectorAll('.world-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    async function startAdventure() {
      const storyBox = document.getElementById('story-text');
      const choicesBox = document.getElementById('choices-container');
      
      storyBox.innerHTML = "⏳ <i>L'IA sta generando l'incipit della tua avventura...</i>";
      choicesBox.innerHTML = "";

      const prompt = `Crea un'introduzione RPG nell'ambientazione '${currentWorld}'. Rispondi SOLO in formato JSON valido: {"story": "testo della storia", "choices": ["Opzione 1", "Opzione 2", "Opzione 3"]}`;
      await callGemini(prompt);
    }

    async function makeChoice(choiceText, previousContext) {
      const storyBox = document.getElementById('story-text');
      const choicesBox = document.getElementById('choices-container');

      storyBox.innerHTML = "⏳ <i>L'IA sta calcolando le conseguenze...</i>";
      choicesBox.innerHTML = "";

      const prompt = `Contesto: "${previousContext}". Scelta giocatore: "${choiceText}". Continua la storia. Rispondi SOLO in JSON valido: {"story": "conseguenze", "choices": ["Opzione 1", "Opzione 2", "Opzione 3"]}`;
      await callGemini(prompt);
    }

    async function callGemini(promptText) {
      const storyBox = document.getElementById('story-text');
      const choicesBox = document.getElementById('choices-container');

      const payload = {
        contents: [{ parts: [{ text: promptText }] }]
      };

      try {
        // Usa l'endpoint corretto per la versione v1beta
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.error) {
          storyBox.innerHTML = `<span style='color: var(--accent-red);'>⚠️ Errore API: ${data.error.message}</span>`;
          return;
        }

        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        
        const parsed = JSON.parse(rawText);

        storyBox.innerText = parsed.story;
        choicesBox.innerHTML = "";

        parsed.choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.innerText = choice;
          btn.onclick = () => makeChoice(choice, parsed.story);
          choicesBox.appendChild(btn);
        });

      } catch (err) {
        console.error(err);
        storyBox.innerHTML = "<span style='color: var(--accent-red);'>❌ Errore durante il caricamento. Riprova.</span>";
      }
    }
  </script>
</body>
</html>
