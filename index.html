<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Publishing — Editor PDF & Giornale</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg-editor: #1f2937;
      --panel-bg: #111827;
      --accent-color: #3b82f6;
      --text-main: #f3f4f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg-editor);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* BARRA STRUMENTI SINISTRA */
    sidebar {
      width: 360px;
      background: var(--panel-bg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      border-right: 1px solid #374151;
      overflow-y: auto;
    }

    h1 { font-size: 1.2rem; color: #fff; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px; }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    label { font-size: 0.85rem; color: #9ca3af; font-weight: 600; }
    
    input, select, textarea {
      background: #1f2937;
      border: 1px solid #4b5563;
      color: #fff;
      padding: 0.6rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    textarea { resize: vertical; min-height: 80px; }

    .btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .btn-export { background: #10b981; margin-top: auto; }
    .btn-export:hover { background: #059669; }

    /* AREA DI ANTEPRIMA (DOCUMENTO) */
    main {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      background: #374151;
    }

    /* FOGLIO A4 STILIZZATO */
    #paper {
      width: 210mm;
      min-height: 297mm;
      background: white;
      color: #111;
      padding: 20mm;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    /* STILE 1: GIORNALE */
    #paper.style-newspaper {
      font-family: 'Times New Roman', Times, serif;
    }
    #paper.style-newspaper h2 {
      font-size: 2.8rem;
      text-align: center;
      text-transform: uppercase;
      border-bottom: 3px double #000;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }
    #paper.style-newspaper .meta {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #000;
      padding-bottom: 5px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      font-style: italic;
    }
    #paper.style-newspaper .content-body {
      column-count: 2;
      column-gap: 20px;
      text-align: justify;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* STILE 2: LIBRO */
    #paper.style-book {
      font-family: Georgia, serif;
      padding: 25mm 25mm;
    }
    #paper.style-book h2 {
      font-size: 2.2rem;
      text-align: center;
      margin-top: 40px;
      margin-bottom: 10px;
      font-weight: normal;
    }
    #paper.style-book .meta {
      text-align: center;
      font-style: italic;
      color: #555;
      margin-bottom: 40px;
    }
    #paper.style-book .content-body {
      font-size: 1.05rem;
      line-height: 1.8;
      text-align: justify;
      text-indent: 1.5em;
    }

    /* STILE 3: MODERNO */
    #paper.style-modern {
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    #paper.style-modern h2 {
      font-size: 2.5rem;
      color: #2563eb;
      border-bottom: 2px solid #2563eb;
      padding-bottom: 8px;
      margin-bottom: 15px;
    }
    #paper.style-modern .meta {
      color: #6b7280;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    #paper.style-modern .content-body {
      font-size: 1rem;
      line-height: 1.6;
      color: #374151;
    }
  </style>
</head>
<body>

  <sidebar>
    <h1>Studio Publishing</h1>

    <div class="form-group">
      <label>Tipo di Layout</label>
      <select id="layout-select" onchange="updateLayout()">
        <option value="style-newspaper">📰 Articolo di Giornale</option>
        <option value="style-book">📖 Capitolo di Libro</option>
        <option value="style-modern">📄 Documento Moderno</option>
      </select>
    </div>

    <div class="form-group">
      <label>Titolo</label>
      <input type="text" id="input-title" value="LA SVOLTA TECNOLOGICA" oninput="renderText()">
    </div>

    <div class="form-group">
      <label>Sottotitolo / Autore / Data</label>
      <input type="text" id="input-meta" value="Edizione Straordinaria — A cura di Mario Rossi" oninput="renderText()">
    </div>

    <div class="form-group">
      <label>Testo del Contenuto</label>
      <textarea id="input-content" rows="12" oninput="renderText()">Oggi segna l'inizio di una nuova era per l'editoria digitale. Con questo nuovo strumento basato completamente su tecnologie Web standard, creare impaginati professionali da esportare direttamente in formato PDF non è mai stato così semplice e immediato.

Non occorrono server remoti o librerie complesse: tutto viene processato istantaneamente all'interno del tuo browser garantendo la massima privacy e una velocità d'esecuzione senza precedenti.

Puoi cambiare in qualsiasi momento lo stile dell'impaginato utilizzando il selettore in alto a sinistra. Scegli tra la grafica classica del giornale multi-colonna, il layout elegante e pulito per libri o l'impostazione moderna adatta a report e articoli generici.</textarea>
    </div>

    <button class="btn btn-export" onclick="exportPDF()">📥 Scarica PDF</button>
  </sidebar>

  <main>
    <div id="paper" class="style-newspaper">
      <h2 id="doc-title">LA SVOLTA TECNOLOGICA</h2>
      <div class="meta" id="doc-meta">Edizione Straordinaria — A cura di Mario Rossi</div>
      <div class="content-body" id="doc-content"></div>
    </div>
  </main>

  <script>
    function renderText() {
      const title = document.getElementById('input-title').value;
      const meta = document.getElementById('input-meta').value;
      const content = document.getElementById('input-content').value;

      document.getElementById('doc-title').innerText = title;
      document.getElementById('doc-meta').innerText = meta;
      
      // Formatta i paragrafi
      const paragraphs = content.split('\n\n').map(p => `<p>${p}</p>`).join('');
      document.getElementById('doc-content').innerHTML = paragraphs;
    }

    function updateLayout() {
      const selectedStyle = document.getElementById('layout-select').value;
      const paper = document.getElementById('paper');
      paper.className = selectedStyle;
    }

    function exportPDF() {
      const element = document.getElementById('paper');
      const filename = document.getElementById('input-title').value.toLowerCase().replace(/\s+/g, '_') + '.pdf';
      
      const opt = {
        margin:       0,
        filename:     filename,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    // Inizializzazione al caricamento
    renderText();
  </script>
</body>
</html>
